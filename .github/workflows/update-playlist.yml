name: Update IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest playlist
        run: |
          curl -fL --retry 3 --retry-delay 5 "https://iptv-org.github.io/iptv/index.m3u" -o index.m3u
          test -s index.m3u
          head -n 1 index.m3u | grep -q "#EXTM3U"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.m3u
          if git diff --cached --quiet; then
            echo "Playlist is already up to date"
          else
            git commit -m "Update IPTV playlist"
            git push
          fi
